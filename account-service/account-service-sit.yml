digital-bank:
  service:
    runtime-profile: sit

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/account_service
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  kafka:
    bootstrap-servers: kafka.digital-bank-sit.svc.cluster.local:9092
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
    properties:
      security.protocol: PLAINTEXT

account:
  ledger:
    kafka:
      enabled: true
      allow-insecure-transport: true
      auto-startup: true
      completed-topic: ledger.posting.completed.v1
      failed-topic: ledger.posting.failed.v1
      group-id: account-service-ledger-outcomes-v1
      retry-attempts: 3
      retry-delay-ms: 1000
  reservation:
    kafka:
      enabled: true
      allow-insecure-transport: true
      auto-startup: true
      requested-topic: account.reservation.requested.v1
      release-requested-topic: account.reservation.release-requested.v1
      accepted-topic: account.reservation.accepted.v1
      rejected-topic: account.reservation.rejected.v1
      released-topic: account.reservation.released.v1
      expired-topic: account.reservation.expired.v1
      group-id: account-service-reservation-v1
      retry-attempts: 3
      retry-delay-ms: 1000
      relay-delay-ms: 1000
