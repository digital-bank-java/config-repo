digital-bank:
  service:
    runtime-profile: sit

auth:
  jwt:
    audience: api-gateway

gateway:
  security:
    enabled: true
  resilience:
    retry:
      retries: 2
    timeout:
      connect-timeout: 1000
      response-timeout: 2s
    circuit-breaker:
      sliding-window-type: COUNT_BASED
      sliding-window-size: 20
      minimum-number-of-calls: 5
      failure-rate-threshold: 50
      wait-duration-in-open-state: 10s
      permitted-number-of-calls-in-half-open-state: 2
      automatic-transition-from-open-to-half-open-enabled: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /admin/docs/swagger-ui.html
    disable-swagger-default-url: true
    urls:
      - name: Customer Service
        url: /admin/docs/customer-service/v3/api-docs
      - name: Account Service
        url: /admin/docs/account-service/v3/api-docs
      - name: Ledger Service
        url: /admin/docs/ledger-service/v3/api-docs
      - name: Auth Service
        url: /admin/docs/auth-service/v3/api-docs
      - name: MFA Service
        url: /admin/docs/mfa-service/v3/api-docs
      - name: Transaction Service
        url: /admin/docs/transaction-service/v3/api-docs
      - name: Payment Service
        url: /admin/docs/payment-service/v3/api-docs

spring:
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD:}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: admin-docs-customer-service-openapi
              uri: http://customer-service:8081
              predicates:
                - Path=/admin/docs/customer-service/v3/api-docs
              filters:
                - PreserveHostHeader
                - RewritePath=/admin/docs/customer-service/(?<segment>.*), /$\{segment}
            - id: admin-docs-account-service-openapi
              uri: http://account-service:8082
              predicates:
                - Path=/admin/docs/account-service/v3/api-docs
              filters:
                - PreserveHostHeader
                - RewritePath=/admin/docs/account-service/(?<segment>.*), /$\{segment}
            - id: admin-docs-ledger-service-openapi
              uri: http://ledger-service:8083
              predicates:
                - Path=/admin/docs/ledger-service/v3/api-docs
              filters:
                - PreserveHostHeader
                - RewritePath=/admin/docs/ledger-service/(?<segment>.*), /$\{segment}
            - id: admin-docs-auth-service-openapi
              uri: http://auth-service:8086
              predicates:
                - Path=/admin/docs/auth-service/v3/api-docs
              filters:
                - PreserveHostHeader
                - RewritePath=/admin/docs/auth-service/(?<segment>.*), /$\{segment}
            - id: admin-docs-mfa-service-openapi
              uri: http://mfa-service:8087
              predicates:
                - Path=/admin/docs/mfa-service/v3/api-docs
              filters:
                - PreserveHostHeader
                - RewritePath=/admin/docs/mfa-service/(?<segment>.*), /$\{segment}
            - id: admin-docs-transaction-service-openapi
              uri: http://transaction-service:8084
              predicates:
                - Path=/admin/docs/transaction-service/v3/api-docs
              filters:
                - PreserveHostHeader
                - RewritePath=/admin/docs/transaction-service/(?<segment>.*), /$\{segment}
            - id: admin-docs-payment-service-openapi
              uri: http://payment-service:8085
              predicates:
                - Path=/admin/docs/payment-service/v3/api-docs
              filters:
                - PreserveHostHeader
                - RewritePath=/admin/docs/payment-service/(?<segment>.*), /$\{segment}
            - id: config-server-health
              uri: http://config-server:8888
              predicates:
                - Path=/config-server/actuator/health
              filters:
                - RewritePath=/config-server/(?<segment>.*), /$\{segment}
            - id: customer-service-health
              uri: http://customer-service:8081
              predicates:
                - Path=/customer-service/actuator/health
              filters:
                - RewritePath=/customer-service/(?<segment>.*), /$\{segment}
            - id: customer-service-openapi
              uri: http://customer-service:8081
              predicates:
                - Path=/customer-service/v3/api-docs
              filters:
                - RewritePath=/customer-service/(?<segment>.*), /$\{segment}
            - id: account-service-health
              uri: http://account-service:8082
              predicates:
                - Path=/account-service/actuator/health
              filters:
                - RewritePath=/account-service/(?<segment>.*), /$\{segment}
            - id: auth-service-health
              uri: http://auth-service:8086
              predicates:
                - Path=/auth-service/actuator/health
              filters:
                - RewritePath=/auth-service/(?<segment>.*), /$\{segment}
            - id: mfa-service-health
              uri: http://mfa-service:8087
              predicates:
                - Path=/mfa-service/actuator/health
              filters:
                - RewritePath=/mfa-service/(?<segment>.*), /$\{segment}
            - id: transaction-service-health
              uri: http://transaction-service:8084
              predicates:
                - Path=/transaction-service/actuator/health
              filters:
                - RewritePath=/transaction-service/(?<segment>.*), /$\{segment}
            - id: payment-service-health
              uri: http://payment-service:8085
              predicates:
                - Path=/payment-service/actuator/health
              filters:
                - RewritePath=/payment-service/(?<segment>.*), /$\{segment}
            - id: auth-service
              uri: http://auth-service:8086
              predicates:
                - Path=/api/v1/auth/**
            - id: mfa-service
              uri: http://mfa-service:8087
              predicates:
                - Path=/api/v1/mfa/**
            - id: transaction-service-transfer-workflows
              uri: http://transaction-service:8084
              predicates:
                - Path=/internal/v1/transfer-workflows,/internal/v1/transfer-workflows/**
            - id: payment-service-instructions
              uri: http://payment-service:8085
              predicates:
                - Path=/internal/v1/payment-instructions,/internal/v1/payment-instructions/**
            - id: account-service-admin-accounts
              uri: http://account-service:8082
              predicates:
                - Path=/admin/v1/accounts,/admin/v1/accounts/**
            - id: customer-service-admin-customers
              uri: http://customer-service:8081
              predicates:
                - Path=/admin/v1/customers,/admin/v1/customers/**
            - id: account-service-customer-accounts
              uri: http://account-service:8082
              predicates:
                - Path=/api/v1/customers/*/accounts
            - id: customer-service
              uri: http://customer-service:8081
              predicates:
                - Path=/api/v1/customers/*,/api/v1/customers/*/profile
            - id: account-service-openapi
              uri: http://account-service:8082
              predicates:
                - Path=/account-service/v3/api-docs
              filters:
                - RewritePath=/account-service/(?<segment>.*), /$\{segment}
            - id: account-service-accounts
              uri: http://account-service:8082
              predicates:
                - Path=/api/v1/accounts/**
