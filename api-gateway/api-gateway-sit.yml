digital-bank:
  service:
    runtime-profile: sit

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /admin/docs/swagger-ui.html
    disable-swagger-default-url: true
    urls:
      - name: Customer Service
        url: /admin/docs/customer-service/v3/api-docs
      - name: Account Service
        url: /admin/docs/account-service/v3/api-docs

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: admin-docs-customer-service-openapi
              uri: http://customer-service:8081
              predicates:
                - Path=/admin/docs/customer-service/v3/api-docs
              filters:
                - PreserveHostHeader
                - RewritePath=/admin/docs/customer-service/(?<segment>.*), /$\{segment}
            - id: admin-docs-account-service-openapi
              uri: http://account-service:8082
              predicates:
                - Path=/admin/docs/account-service/v3/api-docs
              filters:
                - PreserveHostHeader
                - RewritePath=/admin/docs/account-service/(?<segment>.*), /$\{segment}
            - id: config-server-health
              uri: http://config-server:8888
              predicates:
                - Path=/config-server/actuator/health
              filters:
                - RewritePath=/config-server/(?<segment>.*), /$\{segment}
            - id: customer-service-health
              uri: http://customer-service:8081
              predicates:
                - Path=/customer-service/actuator/health
              filters:
                - RewritePath=/customer-service/(?<segment>.*), /$\{segment}
            - id: customer-service-openapi
              uri: http://customer-service:8081
              predicates:
                - Path=/customer-service/v3/api-docs
              filters:
                - RewritePath=/customer-service/(?<segment>.*), /$\{segment}
            - id: account-service-health
              uri: http://account-service:8082
              predicates:
                - Path=/account-service/actuator/health
              filters:
                - RewritePath=/account-service/(?<segment>.*), /$\{segment}
            - id: account-service-customer-accounts
              uri: http://account-service:8082
              predicates:
                - Path=/api/v1/customers/*/accounts
            - id: customer-service
              uri: http://customer-service:8081
              predicates:
                - Path=/api/v1/customers,/api/v1/customers/*,/api/v1/customers/*/profile
            - id: account-service-openapi
              uri: http://account-service:8082
              predicates:
                - Path=/account-service/v3/api-docs
              filters:
                - RewritePath=/account-service/(?<segment>.*), /$\{segment}
            - id: account-service-accounts
              uri: http://account-service:8082
              predicates:
                - Path=/api/v1/accounts/**
