digital-bank:
  service:
    runtime-profile: sit

auth:
  jwt:
    audience: mfa-service

spring:
  kafka:
    bootstrap-servers: kafka.digital-bank-sit.svc.cluster.local:9092
    properties:
      security.protocol: PLAINTEXT

mfa:
  assurance:
    publisher:
      enabled: true
      batch-size: 100
      poll-interval-ms: 5000
