digital-bank:
  service:
    runtime-profile: sit

auth:
  jwt:
    issuer: digital-bank-auth
    secret: ${AUTH_JWT_SECRET:}

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/transaction_service
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  kafka:
    bootstrap-servers: kafka.digital-bank-sit.svc.cluster.local:9092
    properties:
      security.protocol: PLAINTEXT

transaction:
  transfer:
    authorization:
      allowed-subjects: transfer-orchestrator
  events:
    reservation:
      enabled: true
      requested-topic: account.reservation.requested.v1
      release-requested-topic: account.reservation.release-requested.v1
      accepted-topic: account.reservation.accepted.v1
      rejected-topic: account.reservation.rejected.v1
      released-topic: account.reservation.released.v1
      expired-topic: account.reservation.expired.v1
      consumer:
        group-id: transaction-service-reservation-v1
        retry:
          max-attempts: 3
          initial-interval-ms: 1000
          multiplier: 2.0
          max-interval-ms: 10000
      publisher:
        fixed-delay-ms: 1000
        lease-seconds: 900
        send-timeout-seconds: 10
        retry-delay-ms: 5000
      sit-plaintext-enabled: true
      kafka:
        bootstrap-servers: kafka.digital-bank-sit.svc.cluster.local:9092
      security:
        protocol: PLAINTEXT
    mfa-assurance:
      enabled: true
      topic: mfa.assurance.granted.v1
      consumer:
        group-id: transaction-service-mfa-assurance
      kafka:
        bootstrap-servers: kafka.digital-bank-sit.svc.cluster.local:9092
      security:
        protocol: PLAINTEXT
      sit-plaintext-enabled: true
    ledger:
      enabled: true
      requested-topic: ledger.posting.requested.v1
      completed-topic: ledger.posting.completed.v1
      failed-topic: ledger.posting.failed.v1
      consumer:
        group-id: transaction-service-ledger
        retry:
          max-attempts: 3
          initial-interval-ms: 1000
          multiplier: 2.0
          max-interval-ms: 10000
      publisher:
        fixed-delay-ms: 1000
        lease-seconds: 900
        send-timeout-seconds: 10
        retry-delay-ms: 5000
      kafka:
        bootstrap-servers: kafka.digital-bank-sit.svc.cluster.local:9092
      security:
        protocol: PLAINTEXT
      sit-plaintext-enabled: true
    transfer-terminal:
      enabled: true
      completed-topic: events.transfer.completed.v1
      failed-topic: events.transfer.failed.v1
      publisher:
        fixed-delay-ms: 1000
        lease-seconds: 900
        send-timeout-seconds: 10
        retry-delay-ms: 5000
    mfa-assurance:
      enabled: true
      topic: mfa.assurance.granted.v1
      consumer:
        group-id: transaction-service-mfa-assurance
        retry:
          max-attempts: 3
          initial-interval-ms: 1000
          multiplier: 2.0
          max-interval-ms: 10000
      kafka:
        bootstrap-servers: kafka.digital-bank-sit.svc.cluster.local:9092
      security:
        protocol: PLAINTEXT
      sit-plaintext-enabled: true
